kind: tool
id: create_workitem
version: 1.0.0
name: Create Work Item
description: Creates a Prism work item after validation and approval policy permit it.
usage:
  - Use only when a selected skill allows work item creation and the caller has project access.
  - Use for concrete work items that are ready to create or ready to propose for approval.
  - Write the description as plain prose that expands the title with the concrete behavior to deliver.
  - Use assigneeUsernames only after selecting teammates from hydrated member username, role, jobNames, and workspace-scoped member_workloads evidence.
  - Leave assigneeUsernames omitted or empty when capability or workload evidence is insufficient.
do_not_use:
  - Do not use when a similar work item already exists.
  - Do not include fields outside this tool's input contract.
risk_level: high
approval_policy: user_approval_required
input_contract:
  projectId: string
  parentId: optional uuid
  title: string
  description: string
  startDate: optional date
  dueDate: optional date
  priority: optional low | medium | high | urgent
  status: optional todo | in_progress | in_review | done | archived
  assigneeUsernames: optional unique username list
  labelNames: optional unique label list
