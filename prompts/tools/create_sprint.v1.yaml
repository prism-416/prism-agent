kind: tool
id: create_sprint
version: 1.0.0
name: Create Sprint
description: Creates a Prism workspace sprint after validation and approval policy permit it.
usage:
  - Use only when a selected skill allows sprint creation and the caller has workspace access.
  - Use for concrete sprint plans that are ready to create or ready to propose for approval.
do_not_use:
  - Do not include fields outside this tool's input contract.
risk_level: high
approval_policy: user_approval_required
input_contract:
  workspaceId: string
  name: string
  goal: optional string
  startsAt: date-time
  endsAt: date-time
