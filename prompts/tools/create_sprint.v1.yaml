kind: tool
id: create_sprint
version: 1.0.0
name: Create Sprint
description: Creates a Prism workspace sprint after validation and approval policy permit it.
usage:
  - Use only when a selected skill allows sprint creation and the caller has workspace access.
  - Creates through POST /workspaces/{workspaceId}/sprints using CreateSprintDto.
  - Use planned, active, closed, or cancelled for status.
do_not_use:
  - Do not use when approval is required and has not been granted.
  - Do not send fields outside CreateSprintDto.
risk_level: high
approval_policy: user_approval_required
api:
  method: POST
  path: /workspaces/{workspaceId}/sprints
  request_schema: CreateSprintDto
  response_schema: SprintResponseDto
  response_wrapper: data
input_contract:
  workspaceId: string
  name: string
  goal: optional string
  startsAt: date-time
  endsAt: date-time
  status: optional planned | active | closed | cancelled
constraints:
  name_max_length: 50
  goal_max_length: 1000
