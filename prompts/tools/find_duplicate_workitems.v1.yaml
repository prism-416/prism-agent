kind: tool
id: find_duplicate_workitems
version: 1.0.0
name: Find Duplicate Work Items
description: Searches hydrated backlog context for duplicate or overlapping work items.
usage:
  - Use before proposing new work items.
  - Use during backlog refinement and story decomposition.
  - Match the API search model from GET /projects/{projectId}/work-items.
  - Prefer query, parentId, priority, status, assigneeUsername, labelName, limit, and offset filters.
do_not_use:
  - Do not use to decide priority by itself.
risk_level: low
approval_policy: auto_commit
api:
  method: GET
  path: /projects/{projectId}/work-items
  response_schema: SearchWorkItemsResponseDto
  response_wrapper: data
input_contract:
  projectId: string
  title: string
  parentId: optional uuid
  status: optional todo | in_progress | in_review | done | archived
constraints:
  query_max_length: 100
  limit_min: 1
  limit_max: 100
