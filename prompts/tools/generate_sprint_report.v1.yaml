kind: tool
id: generate_sprint_report
version: 1.0.0
name: Generate Sprint Report
description: Generates a sprint report artifact from hydrated sprint and project context.
usage:
  - Use when a workflow is explicitly generating a sprint report.
  - Base report content on SprintResponseDto and sprint work items from GET /projects/{projectId}/sprints/{sprintId}/work-items.
  - Use as a runtime/internal artifact unless a report endpoint is added.
do_not_use:
  - Do not use for daily summaries that should create dashboard insights.
risk_level: low
approval_policy: auto_commit
api:
  status: runtime_internal
  current_openapi_endpoint: none
  recommended_endpoint: POST /projects/{projectId}/sprints/{sprintId}/reports
input_contract:
  projectId: string
  sprintId: string
  report: string
