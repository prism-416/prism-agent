kind: tool
id: generate_sprint_report
version: 1.0.0
name: Generate Sprint Report
description: Generates a sprint report artifact from hydrated sprint and project context.
usage:
  - Use when a workflow is explicitly generating a sprint report.
  - Base report content on hydrated sprint and sprint work item context.
  - Use when the workflow should publish or record a sprint report artifact.
do_not_use:
  - Do not use for daily summaries that should create dashboard insights.
risk_level: low
approval_policy: auto_commit
input_contract:
  workspaceId: string
  sprint_id: string
  report: string
