kind: tool
id: create_workitem_tree
version: 1.0.0
name: Create Work Item Tree
description: >
  Creates a full hierarchy of Prism work items in one action. Each item may carry a
  children list; children are created under their parent automatically. This is the
  preferred tool for decomposition and provisioning because it commits the entire
  work breakdown at once instead of one item per action.
usage:
  - Use when the plan produces more than one related work item; put the whole breakdown in a single action.
  - Put the complete breakdown into the action-level work_items field (NOT inside input); each entry has title, description, optional priority/status/dates/assignee_usernames/label_names, and an optional children array of nested entries. An action with empty work_items is invalid and does nothing.
  - Set input to the routing fields only, such as projectId and the optional top-level parentId.
  - Use children to express hierarchy. Parent ids are resolved automatically; never invent parentId values for tree nodes.
  - Set parentId only at the top level, and only to attach the whole tree under an existing work item (for example the source story).
  - Each item's description must expand its title in plain prose with the concrete behavior to deliver; never leave it empty or restate the title.
  - Use assigneeUsernames only with usernames taken from hydrated member context, after checking jobNames, role, and member_workloads evidence.
  - Assign at the leaf task level; every assignee on a child is automatically added to all of its ancestor items, so parents need no manual copy of child assignees.
  - Leave assigneeUsernames empty when capability or workload evidence is insufficient.
do_not_use:
  - Do not use for a single small edit to an existing work item; use update_workitem instead.
  - Do not recreate items that find_duplicate_workitems or hydrated context show already exist.
  - Do not include fields outside this tool's input contract.
risk_level: high
approval_policy: auto_commit
input_contract:
  projectId: string
  parentId: optional uuid of an existing work item to attach the whole tree under
  items: required non-empty array of work item node objects
  items[] node:
    title: string, required
    description: string, required
    startDate: optional date
    dueDate: optional date
    priority: optional low | medium | high | urgent
    status: optional todo | in_progress | in_review | done | archived
    assigneeUsernames: optional unique username list
    labelNames: optional unique label list
    children: optional array of nodes with this same shape
