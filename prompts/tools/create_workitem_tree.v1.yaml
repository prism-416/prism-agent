kind: tool
id: create_workitem_tree
version: 1.0.0
name: Create Work Item Tree
description: >
  Creates a full hierarchy of Prism work items in one action. Each item may carry a
  children list; children are created under their parent automatically. This is the
  preferred tool for decomposition and provisioning because it commits the entire
  work breakdown at once instead of one item per action.
usage:
  - Use when the plan produces more than one related work item; put the whole breakdown in a single action.
  - Use items[].children to express hierarchy. Parent ids are resolved automatically; never invent parentId values for tree nodes.
  - Set parentId only at the top level, and only to attach the whole tree under an existing work item (for example the source story).
  - Put acceptance criteria inside each item's description.
  - Use assigneeUsernames only with usernames taken from hydrated member context, after checking jobNames, role, and member_workloads evidence.
  - Leave assigneeUsernames empty when capability or workload evidence is insufficient.
do_not_use:
  - Do not use for a single small edit to an existing work item; use update_workitem instead.
  - Do not recreate items that find_duplicate_workitems or hydrated context show already exist.
  - Do not include fields outside this tool's input contract.
risk_level: high
approval_policy: auto_commit
input_contract:
  projectId: string
  parentId: optional uuid of an existing work item to attach the whole tree under
  items: >
    required non-empty list of work item nodes; each node accepts title (string,
    required), description (string, required), startDate (optional date),
    dueDate (optional date), priority (optional low | medium | high | urgent),
    status (optional todo | in_progress | in_review | done | archived),
    assigneeUsernames (optional unique username list), labelNames (optional
    unique label list), children (optional list of nodes with the same shape)
