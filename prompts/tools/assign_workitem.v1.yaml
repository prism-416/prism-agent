kind: tool
id: assign_workitem
version: 1.0.0
name: Assign Work Item
description: Assigns a work item to a workspace member.
usage:
  - Use only when assignment is explicitly requested or policy-selected.
  - Use assigneeUsernames only after selecting teammates from hydrated member username, role, jobNames, and workspace-scoped member_workloads evidence.
  - Leave work unassigned when capability or workload evidence is insufficient.
do_not_use:
  - Do not use to infer ownership without evidence.
risk_level: medium
approval_policy: user_approval_required
input_contract:
  projectId: string
  itemId: string
  assigneeUsernames: unique username list
