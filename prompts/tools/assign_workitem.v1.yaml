kind: tool
id: assign_workitem
version: 1.0.0
name: Assign Work Item
description: Assigns a work item to a workspace member.
usage:
  - Use only when assignment is explicitly requested or policy-selected.
  - Implement as PATCH /projects/{projectId}/work-items/{itemId} with UpdateWorkItemDto.assigneeUsernames.
  - Assignees are usernames from ProjectMemberListResponseDto.username, not user IDs.
do_not_use:
  - Do not use to infer ownership without evidence.
risk_level: medium
approval_policy: user_approval_required
api:
  method: PATCH
  path: /projects/{projectId}/work-items/{itemId}
  request_schema: UpdateWorkItemDto
  response_schema: WorkItemResponseDto
  response_wrapper: data
input_contract:
  projectId: string
  itemId: string
  assigneeUsernames: unique username list
constraints:
  assignee_username_max_length: 30
