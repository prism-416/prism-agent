kind: tool
id: add_workitem_comment
version: 1.0.0
name: Add Work Item Comment
description: Prepares a work item comment with agent-generated context.
usage:
  - Use to collaborate as the authenticated Prism teammate on a specific work item.
  - Use only when comment output should be recorded or surfaced for approval.
  - Keep comments concise and evidence-backed.
do_not_use:
  - Do not use for noisy status repetition.
risk_level: medium
approval_policy: user_approval_required
input_contract:
  projectId: string
  itemId: string
  comment: string
