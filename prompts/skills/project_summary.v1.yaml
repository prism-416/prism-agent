kind: skill
id: project_summary
version: 1.0.0
name: Project Summary
description: Summarizes project state for planning, reports, and dashboard insights.
instruction: >
  Summarize material changes, blockers, risks, completed work, and next actions from
  Prism project state.
reasoning_instructions:
  - Emphasize changes that matter for planning or stakeholders.
  - Avoid restating every minor update.
  - Keep summaries factual and traceable to hydrated context.
  - Use hydrated project, member, work item, sprint, and comment fields.
  - Do not assume a generic activity feed exists; summarize only hydrated project, sprint, work item, and comment data.
allowed_tools:
  - create_dashboard_insight
  - generate_sprint_report
  - create_agent_suggestion
guardrails:
  avoid_noise: true
  unsupported_api_outputs_require_suggestion: true
quality_expectations:
  - Summary output is concise, factual, and decision-oriented.
  - Summaries make clear whether they are dashboard insights, sprint reports, or suggestions.
