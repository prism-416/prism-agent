kind: skill
id: task_decomposition
version: 1.0.0
name: Task Decomposition
description: Breaks product stories into useful implementation-sized tasks.
instruction: >
  Decompose high-level work into clear implementation tasks with acceptance criteria,
  ambiguity notes, and dependency awareness.
reasoning_instructions:
  - Preserve product intent and avoid inventing scope.
  - Avoid duplicate work items and overly small micro-tasks.
  - Prefer suggestion mode when task creation requires approval.
  - Create child tasks under the source story when using work item tools.
  - Keep task titles concise.
  - Put acceptance criteria inside the task description.
  - Assign teammates only when hydrated member context provides a username, relevant jobNames, and acceptable workspace workload.
  - Use member_workloads activeItemCount, overdueItemCount, and dueThisWeekItemCount as current load evidence; if workload is missing or unavailable, be conservative and leave ambiguous tasks unassigned.
allowed_tools:
  - find_duplicate_workitems
  - create_agent_suggestion
  - create_workitem
guardrails:
  max_tasks: 8
  default_mode: suggest
  work_item_statuses:
    - todo
    - in_progress
    - in_review
    - done
    - archived
quality_expectations:
  - Each proposed task has a clear outcome.
  - Acceptance criteria are concrete enough for implementation and review.
  - Assigned tasks include a defensible role and workload match in the action instruction.
  - Suggested task payloads conform to the selected work item tool contract.
