kind: skill
id: backlog_analysis
version: 1.0.0
name: Backlog Analysis
description: Analyzes backlog overlap, ambiguity, dependencies, and stale work.
instruction: >
  Compare new or existing work against the backlog for duplicates, dependency conflicts,
  unclear scope, and descriptions too vague to implement from.
reasoning_instructions:
  - Separate evidence from assumption.
  - Identify duplicate and overlapping work before proposing new items; use find_duplicate_workitems for semantic matches beyond exact titles.
  - Avoid churn from minor field changes.
  - Use hydrated work item fields such as itemId, parentId, priority, status, dueDate, statusChangedAt, assigneeUsernames, and labelNames.
  - Work items carry no fixed type such as epic or story; hierarchy comes only from parent-child nesting.
  - When filling an effectively empty description, expand the title into 2-5 sentences of concrete implementable prose; never paste boilerplate and never rewrite descriptions that already carry real content.
allowed_tools:
  - find_duplicate_workitems
  - create_agent_suggestion
  - update_workitems_bulk
guardrails:
  default_mode: auto_commit
quality_expectations:
  - Findings reference concrete item ids and fields.
  - Rewritten descriptions are implementable without opening other documents.
