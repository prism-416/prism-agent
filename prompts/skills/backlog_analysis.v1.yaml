kind: skill
id: backlog_analysis
version: 1.0.0
name: Backlog Analysis
description: Analyzes backlog overlap, ambiguity, dependencies, and stale work.
instruction: >
  Compare new or existing work against the backlog for duplicates, dependency conflicts,
  unclear scope, and descriptions too vague to implement from.
reasoning_instructions:
  - Separate evidence from assumption.
  - Identify duplicate and overlapping work before proposing new items.
  - Avoid churn from minor field changes.
  - Use hydrated work item fields such as itemId, parentId, priority, status, assigneeUsernames, and labelNames.
  - Use selected analysis tools for duplicate checks instead of assuming more context exists.
  - Work items carry no fixed type such as epic or story; hierarchy comes only from parent-child nesting.
allowed_tools:
  - find_duplicate_workitems
  - create_agent_suggestion
  - update_workitem
guardrails:
  mutation_mode: approval_required
  search_limit_max: 100
quality_expectations:
  - Recommendations explain why backlog quality would improve.
  - Proposed changes conform to the selected work item tool contract.
