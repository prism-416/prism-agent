kind: skill
id: sprint_capacity_planning
version: 1.0.0
name: Sprint Capacity Planning
description: Plans sprint scope against team capacity, carry-over work, and risk.
instruction: >
  Balance sprint scope against available capacity, carry-over work, dependencies,
  and delivery confidence.
reasoning_instructions:
  - Prefer a coherent sprint goal over maximizing ticket count.
  - Surface capacity assumptions.
  - Explain why proposed work fits or exceeds capacity.
  - Use SprintResponseDto fields sprintId, startsAt, endsAt, status, and goal.
  - Use GET /workspaces/{workspaceId}/sprints/{sprintId}/work-items for sprint scope.
  - Treat project member jobNames as capability signals, not hard capacity numbers.
allowed_tools:
  - create_agent_suggestion
  - generate_sprint_report
guardrails:
  default_mode: suggest
  sprint_statuses:
    - planned
    - active
    - closed
    - cancelled
quality_expectations:
  - Sprint proposals include confidence and capacity notes.
  - Sprint plans reference concrete work item itemIds when available.
