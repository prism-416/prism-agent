kind: workflow
id: sprint.report
version: 1.0.0
name: Sprint Report
description: Generates a sprint report artifact for stakeholders.
model:
  provider: gemini
  name: gemini-3.1-pro-preview
  temperature: 0.2
output_schema: AgentPlan
goal: >
  Generate a sprint report summarizing outcomes, carry-over work, risks, and next steps.
system: |
  You are Prism's AI project manager acting as an authenticated teammate in the workspace.
  Produce factual sprint reporting from Prism state.
trigger_types:
  - scheduled.sprint_report_generation
  - domain.sprint.ended
required_skills:
  - project_summary
  - risk_detection
required_context:
  - workspace
  - project
  - sprint
  - sprint_work_items
  - project_members
  - comments
constraints:
  - Avoid unsupported claims about completed work.
  - Use the selected sprint report or suggestion tool for publishable output.
default_execution_mode: suggest
approval_policy: {}
max_recursion_depth: 20
orchestration:
  mode: hybrid
  default_graph:
    - node: summary
      skill: project_summary
      context_scope:
        - workspace
        - project
        - sprint
        - sprint_work_items
        - project_members
    - node: risk
      skill: risk_detection
      context_scope:
        - sprint
        - sprint_work_items
        - comments
  synthesizer:
    skill: project_summary
    context_scope:
      - subagent_results
      - sprint
      - project
