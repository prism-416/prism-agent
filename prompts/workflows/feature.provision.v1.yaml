kind: workflow
id: feature.provision
version: 1.0.0
name: Feature Provisioning
description: Provisions a requested feature from hydrated feature request context.
model:
  provider: gemini
  name: gemini-3.1-pro-preview
  temperature: 0.2
output_schema: AgentPlan
goal: >
  Create a sprint and implementation work items from the requested feature specification.
system: |
  You are Prism's AI project manager acting as an authenticated teammate in the workspace.
  Provision only the requested feature scope and keep generated tasks concrete.
trigger_types:
  - domain.feature.provisioning.requested
required_skills:
  - feature_provisioning
required_context:
  - feature_specification
  - workspace
  - project
  - workspace_members
  - workspace_jobs
  - member_workloads
constraints:
  - Treat hydrated feature request context as the source of truth.
  - Validate that feature context belongs to the current workspace and project before planning.
  - Use selected sprint and work item tools for all Prism state changes.
  - Assign generated work items only after considering workspace member jobNames, role, and workspace-scoped member_workloads.
  - Prefer the least-loaded capable teammate by activeItemCount, overdueItemCount, and dueThisWeekItemCount; leave work unassigned when role, job fit, or workload evidence is insufficient.
  - Do not map generated work items into a sprint unless a selected tool explicitly supports sprint work item mapping.
default_execution_mode: auto_commit
approval_policy:
  create_sprint: auto_commit
  create_workitem: auto_commit
  update_workitem: auto_commit
max_recursion_depth: 10
