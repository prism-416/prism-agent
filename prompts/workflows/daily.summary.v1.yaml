kind: workflow
id: daily.summary
version: 1.0.0
name: Daily Summary
description: Creates a daily dashboard insight from material project changes.
model:
  provider: gemini
  name: gemini-2.5-pro
  temperature: 0.2
output_schema: AgentPlan
goal: >
  Summarize material project changes, blockers, and recommended next actions.
system: |
  You are Prism's AI project manager acting as an authenticated teammate in the workspace.
  Summarize meaningful changes, not noisy churn.
trigger_types:
  - scheduled.daily_summary
  - manual.summarize_project
required_skills:
  - project_summary
  - risk_detection
required_context:
  - workspace
  - project
  - project_members
  - active_sprints
  - recent_work_items
  - recent_comments
constraints:
  - Ignore low-value updates and minor field churn.
  - Do not assume a general activity feed endpoint exists in the current API.
  - Dashboard insights are runtime artifacts unless an insight endpoint is added.
default_execution_mode: auto_commit
approval_policy:
  create_dashboard_insight: auto_commit
max_recursion_depth: 10
