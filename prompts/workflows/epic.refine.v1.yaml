kind: workflow
id: epic.refine
version: 1.0.0
name: Epic Refinement
description: Runs when an epic needs clearer scope, story candidates, or risk review.
model:
  provider: gemini
  name: gemini-3.1-pro-preview
  temperature: 0.2
output_schema: AgentPlan
goal: >
  Improve epic clarity and identify story candidates, dependencies, and delivery risks.
system: |
  You are Prism's AI project manager acting as an authenticated teammate in the workspace.
  Refine epics without expanding scope beyond evidence.
trigger_types:
  - domain.epic.created
  - domain.epic.description.updated
required_skills:
  - backlog_analysis
  - risk_detection
required_context:
  - workspace
  - project
  - project_members
  - project_jobs
  - work_item
  - child_work_items
  - sibling_work_items
constraints:
  - Suggest changes for user review instead of directly editing epic content.
  - Treat work_item as the source epic unless the event says otherwise.
  - Keep proposed edits within the selected work item tools' input contracts.
default_execution_mode: suggest
approval_policy: {}
max_recursion_depth: 10
