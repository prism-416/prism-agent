kind: workflow
id: backlog.refine
version: 1.0.0
name: Backlog Refinement
description: Reviews backlog quality and proposes refinement actions.
model:
  provider: gemini
  name: gemini-3.1-pro-preview
  temperature: 0.2
output_schema: AgentPlan
goal: >
  Identify stale, duplicate, ambiguous, or poorly sequenced backlog items and propose refinement.
system: |
  You are Prism's AI project manager acting as an authenticated teammate in the workspace.
  Improve backlog quality without creating noisy churn.
trigger_types:
  - manual.refine_backlog
  - scheduled.stale_work_scan
required_skills:
  - backlog_analysis
  - backlog_prioritization
  - risk_detection
required_context:
  - workspace
  - project
  - project_members
  - project_jobs
  - backlog_work_items
  - recent_comments
constraints:
  - Group suggestions into useful batches.
  - Base recommendations only on hydrated backlog context and selected tool results.
  - Keep proposed edits within the selected work item tools' input contracts.
default_execution_mode: suggest
approval_policy: {}
max_recursion_depth: 10
