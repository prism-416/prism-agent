name: Deploy Prism Agent to OCI Function (DEV)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: develop
  pull_request:
    branches: [develop]
    types: [closed]

jobs:
  deploy:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_FUNCTION_APPLICATION_OCID: ${{ secrets.OCI_FUNCTION_APPLICATION_OCID }}
      FUNCTION_DISPLAY_NAME: ${{ vars.OCI_FUNCTION_NAME || 'prism-agent-dev' }}
      FUNCTION_MEMORY_MB: ${{ vars.OCI_FUNCTION_MEMORY_MB || '512' }}
      FUNCTION_TIMEOUT_SECONDS: ${{ vars.OCI_FUNCTION_TIMEOUT_SECONDS || '300' }}
      OCIR_REPOSITORY_NAME: ${{ vars.OCIR_REPOSITORY_NAME || 'prism-agent' }}
      OCI_FUNCTION_PLATFORM: ${{ vars.OCI_FUNCTION_PLATFORM || 'linux/amd64' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_ENV=(
            OCI_CLI_USER
            OCI_CLI_TENANCY
            OCI_CLI_FINGERPRINT
            OCI_CLI_KEY_CONTENT
            OCI_CLI_REGION
            OCI_AUTH_TOKEN
            OCI_COMPARTMENT_OCID
            OCI_FUNCTION_APPLICATION_OCID
          )

          missing=()
          for name in "${REQUIRED_ENV[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deployment inputs:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run lint and tests
        run: |
          pre-commit run --all-files
          python -m pytest -p no:cacheprovider

      - name: Install OCI CLI
        run: python -m pip install oci-cli

      - name: Debug OCI identity
        shell: bash
        run: |
          set -euo pipefail

          echo "OCI region:"
          echo "$OCI_CLI_REGION"

          echo "Object Storage / OCIR namespace:"
          oci os ns get --query 'data' --raw-output

          echo "OCI CLI user name:"
          oci iam user get \
            --user-id "$OCI_CLI_USER" \
            --query 'data.name' \
            --raw-output

          echo "Tenancy name:"
          oci iam tenancy get \
            --tenancy-id "$OCI_CLI_TENANCY" \
            --query 'data.name' \
            --raw-output

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get or create OCIR repository
        id: ocir
        uses: oracle-actions/get-ocir-repository@v1.3.0
        with:
          name: ${{ env.OCIR_REPOSITORY_NAME }}
          compartment: ${{ env.OCI_COMPARTMENT_OCID }}

      - name: Debug OCIR repository
        shell: bash
        run: |
          set -euo pipefail

          echo "OCIR repository path:"
          echo "${{ steps.ocir.outputs.repo_path }}"

      - name: Log in to OCIR
        uses: oracle-actions/login-ocir@v1.3.0
        with:
          auth_token: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push function image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_SHA="${{ steps.ocir.outputs.repo_path }}:dev-${SHORT_SHA}"
          IMAGE_DEV="${{ steps.ocir.outputs.repo_path }}:dev"

          docker buildx build \
            --platform "$OCI_FUNCTION_PLATFORM" \
            -f Dockerfile.oci \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_DEV" \
            --push \
            .

          echo "image=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create or update OCI function
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_ID="$(oci fn function list \
            --application-id "$OCI_FUNCTION_APPLICATION_OCID" \
            --display-name "$FUNCTION_DISPLAY_NAME" \
            --query 'data[0].id' \
            --raw-output || true)"

          if [ -z "$FUNCTION_ID" ] || [ "$FUNCTION_ID" = "null" ]; then
            echo "Creating OCI function: $FUNCTION_DISPLAY_NAME"

            oci fn function create \
              --application-id "$OCI_FUNCTION_APPLICATION_OCID" \
              --display-name "$FUNCTION_DISPLAY_NAME" \
              --image "${{ steps.image.outputs.image }}" \
              --memory-in-mbs "$FUNCTION_MEMORY_MB" \
              --timeout-in-seconds "$FUNCTION_TIMEOUT_SECONDS" \
              --wait-for-state ACTIVE
          else
            echo "Updating OCI function: $FUNCTION_DISPLAY_NAME ($FUNCTION_ID)"

            oci fn function update \
              --function-id "$FUNCTION_ID" \
              --image "${{ steps.image.outputs.image }}" \
              --memory-in-mbs "$FUNCTION_MEMORY_MB" \
              --timeout-in-seconds "$FUNCTION_TIMEOUT_SECONDS" \
              --force \
              --wait-for-state ACTIVE
          fi
