[project]
name = "pydanticai-rag-template"
version = "0.1.0"
description = "Serverless-first async PydanticAI RAG template with Gemini, pgvector, and YAML prompts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "pydantic-ai>=0.0.20",
  "google-genai>=1.0.0",
  "PyYAML>=6.0.1",
  "asyncpg>=0.29.0",
  "pgvector>=0.3.3",
  "tenacity>=8.4.1",
  "structlog>=24.2.0",
  "python-json-logger>=2.0.7",
  "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
