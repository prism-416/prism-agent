[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-agent"
version = "0.1.0"
description = "Recursive event-driven AI project manager runtime for Prism."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-ai>=0.0.52",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
prod = [
  "oci>=2.125",
]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "B904",
]
